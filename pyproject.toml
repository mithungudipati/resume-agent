[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-agent"
version = "0.1.0"
description = "Evaluator-optimizer resume agent for DevOps Engineering Manager roles"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
    "pdfplumber>=0.10",
    "python-docx>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.scripts]
resume-agent = "resume_agent.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
